 const signature=JSON.stringify(workspaceState.workspaces);

// Each computer serves this viewer at <computer path>/viewer.
const base = location.pathname.replace(/\/viewer$/, '');
async function rpc(path, args) {
  const response = await fetch(base + path, { method: args === undefined ? 'GET' : 'POST', ...(args === undefined ? {} : { headers: {'Content-Type':'application/json'}, body: JSON.stringify(args) }) });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'could not connect');
  return result;
}
async function connect(token) {
  if (token) {
    const session = await fetch('/session', { method:'POST', headers:{Authorization:`Bearer ${token}`} });
    if (!session.ok) throw new Error('credential not accepted');
  }
  document.querySelector('#login').hidden = true;
  updateOwnership(await rpc('/status'));
  if (!status.viewerOpen) updateOwnership(await rpc('/watch', {}));
  document.querySelector('#open').hidden = true;
  clearTimeout(frameTimer);
  if (status.mode !== 'human') {
    if (rfb) { const previous=rfb;rfb=null;previous.disconnect(); }
    preview.hidden=false;
    void refreshFrame();
  } else if (!rfb) {
    preview.hidden=true;hint.classList.remove('visible');hint.setAttribute('aria-hidden','true');
    const {default:RFB} = await import(base + '/vnc/core/rfb.js');
    rfb = new RFB(document.querySelector('#screen'), `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${base}/vnc/websockify`);
    rfb.scaleViewport=true;rfb.resizeSession=false;
    rfb.addEventListener('connect',()=>{message.style.display='none';rfb?.focus();void refreshWindows().catch(showError)});
    rfb.addEventListener('disconnect',()=>{rfb=null;});
  }
  clearInterval(interval);
  interval=setInterval(async()=>{try{const value=await rpc('/status');if(value.mode!==status.mode||value.viewerOpen!==status.viewerOpen)await connect();else updateOwnership(value);await refreshWindows()}catch(error){showError(error)}},2000);
  await refreshWindows();
}
function showError(error) { message.style.display='flex'; detail.textContent=error.message; }
