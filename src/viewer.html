<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>igor vm</title>
<style>
:root{color-scheme:dark}[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#17191d;color:#e8e9ed;font:13px system-ui}body{display:flex;flex-direction:column}header{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#262b30;border-bottom:1px solid #ffffff0c}header strong{font-weight:600}header .spacer{flex:1}button,input,select{font:inherit;color:inherit;border:1px solid #ffffff18;border-radius:8px;padding:7px 11px;background:#ffffff08}button{cursor:pointer}button:hover{background:#ffffff15}button:active{background:#ffffff20}button:disabled{opacity:.5;cursor:default}#done{color:#68d88b;background:#40b76a18}#screen{flex:1;min-height:0;position:relative}#message{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}#message p{margin:0;max-width:420px;line-height:1.5}#login{display:flex;gap:8px;max-width:100%}#token{width:280px;min-width:0}.muted{color:#9da4ad}label{display:flex;align-items:center;gap:6px}input[type=checkbox]{accent-color:#4998ff}body.native header{display:none}#windows{display:flex;gap:6px;overflow:auto;min-width:0;max-width:50vw}.window{display:flex;align-items:center;border-radius:8px;background:#ffffff08}.window.active{background:#4b95ff25}.window button{background:none;border:0;border-radius:6px;padding:6px 9px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}.window button:hover{background:#ffffff12}.window .close:hover{background:#dc4545;color:white}

.taskbar{height:42px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#262b30;border-bottom:1px solid #ffffff0c}.taskbar .spacer{flex:1}body.native .taskbar{display:none}#open-browser{width:32px;height:32px;padding:4px;border:0;background:none}#open-browser:hover{background:#ffffff12}#open-browser img{width:24px;height:24px}.divider{width:1px;height:20px;background:#ffffff18}.window{position:relative;border-radius:6px}.window.active{background:#ffffff0d}.window.active:after{content:"";position:absolute;bottom:0;left:calc(50% - 10px);width:20px;height:2px;border-radius:2px;background:#4998ff;pointer-events:none}.window .focus{display:flex;gap:8px;align-items:center}.window img{width:18px;height:18px}.window .focus span{overflow:hidden;text-overflow:ellipsis}

.taskbar{height:48px;flex-shrink:0;border-bottom:0;border-top:1px solid #ffffff12;background:#25292e;gap:10px}.taskbar button{transition:background .12s,transform .12s}.taskbar button:active{transform:scale(.95)}#app-menu{border:0;background:none;font-size:22px;padding:3px 7px}#pins{display:flex;gap:4px;min-width:34px;min-height:34px;max-width:30vw;overflow-x:auto;align-items:center}.pin{flex-shrink:0}.popup>.launch{width:100%}.pin{width:34px;height:34px;padding:5px;border:0;background:none}.pin{position:relative}.pin.running:after{content:"";position:absolute;bottom:0;left:calc(50% - 1.5px);width:3px;height:3px;border-radius:50%;background:#4998ff}.pin img{width:24px;height:24px}.popup{position:fixed;z-index:10;padding:6px;background:#2a2e34f5;backdrop-filter:blur(20px);border:1px solid #ffffff1c;border-radius:12px;box-shadow:0 8px 30px #0006;min-width:220px}.popup .row{display:flex;gap:4px;align-items:center}.popup button{border:0;background:none;text-align:left}.popup .launch{flex:1;display:flex;align-items:center;gap:10px}.popup img,#workspace-button img{width:24px;height:24px;border-radius:50%;object-fit:cover}.popup .initial,#workspace-button .initial{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#679cf52a;font-weight:600}.popup .pin-action{font-size:11px;color:#aeb5c0}#workspace-button{display:flex;align-items:center;gap:8px;border:0}#screen.switching{pointer-events:none}.workspace-cover{position:absolute;inset:0;z-index:4;background:#17191d;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .13s ease;pointer-events:none}.workspace-cover.visible{opacity:1}.workspace-cover img{width:48px;height:48px;border-radius:50%;object-fit:cover}.workspace-cover .badge{display:flex;align-items:center;gap:12px;font-size:15px}.window{transition:background .12s}.window .focus{max-width:210px}.window .close{padding:6px 8px}.window img{flex-shrink:0}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><strong>igor vm</strong><button id="workspace-button" aria-label="switch workspace">user</button><select hidden id="workspaces" aria-label="workspace"><option>user</option></select><button id="new-workspace" title="new workspace">+</button><span class="spacer"></span><button id="restore" title="restore windows" aria-label="restore windows">↺</button><label>automation<input id="automation" type="checkbox" checked></label><button id="done">✓ done</button></header>
<div id="screen"><div id="message"><p id="detail">connecting to your computer…</p><form id="login" hidden><input id="token" type="password" autocomplete="off" placeholder="server credential" aria-label="server credential"><button>connect</button></form><button id="open" hidden>take control</button></div></div>
<div class="taskbar"><button id="app-menu" title="apps" aria-label="apps">⊞</button><div id="pins"></div><button hidden id="open-browser" title="open or focus chromium in this workspace" aria-label="open chromium"><img src="/assets/chromium.png" alt=""></button><span class="divider"></span><div id="windows"></div><span class="spacer"></span><span class="muted">automation pauses while you use it</span></div>
<script type="module">
const native = new URLSearchParams(location.search).get('native') === '1';
if (native) document.body.classList.add('native');
const message = document.querySelector('#message'), detail = document.querySelector('#detail');
let rfb, status, interval, windowState, appsState, popup;
const screen=document.querySelector('#screen');
const cover=document.createElement('div');cover.className='workspace-cover';cover.setAttribute('aria-hidden','true');screen.append(cover);
function dismissPopup(){popup?.remove();popup=null}
document.addEventListener('pointerdown',event=>{if(popup&&!popup.contains(event.target)&&!event.target.closest('#app-menu,#workspace-button'))dismissPopup()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')dismissPopup()});
function picture(workspace){const node=document.createElement(workspace.avatar?'img':'span');if(workspace.avatar){node.src=workspace.avatar;node.alt=''}else{node.className='initial';node.textContent=(workspace.label||'user').slice(0,1).toUpperCase()}return node}
function workspaceLabel(workspace){const label=document.createElement('span');label.textContent=workspace.label;return label}
window.workspaceTransition={begin(workspace){cover.setAttribute('aria-hidden','false');screen.classList.add('switching');rfb?.blur();cover.replaceChildren();if(workspace){const badge=document.createElement('div');badge.className='badge';badge.append(picture(workspace),workspaceLabel(workspace));cover.append(badge)}cover.classList.add('visible')},end(){setTimeout(()=>{cover.classList.remove('visible');cover.setAttribute('aria-hidden','true');screen.classList.remove('switching');rfb?.focus()},150)}};
async function selectWorkspace(name){dismissPopup();window.workspaceTransition.begin(windowState?.workspaces.find(w=>w.name===name));try{await rpc('/workspaces',{action:'select',name});await refreshWindows()}catch(error){showError(error)}finally{window.workspaceTransition.end()}}
function makePopup(button,bottom=false){dismissPopup();popup=document.createElement('div');popup.className='popup';document.body.append(popup);const rect=button.getBoundingClientRect();popup.style.left=rect.left+'px';if(bottom)popup.style.bottom=(innerHeight-rect.top+8)+'px';else popup.style.top=(rect.bottom+8)+'px';return popup}
document.querySelector('#workspace-button').onclick=event=>{const menu=makePopup(event.currentTarget);for(const workspace of windowState?.workspaces||[]){const button=document.createElement('button');button.className='launch';button.append(picture(workspace),workspaceLabel(workspace));button.onclick=()=>selectWorkspace(workspace.name);menu.append(button)}};
async function setPins(pins){appsState=await rpc('/apps',{action:'pin',pins});renderPins()}
async function launchApp(id){dismissPopup();try{await rpc('/apps',{action:'launch',id});await refreshWindows();rfb?.focus()}catch(error){showError(error)}}
function pinAction(id){return setPins(appsState.pins.includes(id)?appsState.pins.filter(pin=>pin!==id):[...appsState.pins,id])}
function renderPins(){const strip=document.querySelector('#pins');strip.replaceChildren();for(const id of appsState.pins){const app=appsState.apps.find(app=>app.id===id);if(!app)continue;const button=document.createElement('button');button.className='pin';button.title=app.name+' · drag to reorder or away to unpin';button.setAttribute('aria-label','open '+app.name);button.draggable=true;button.dataset.app=id;if(app.icon){const icon=document.createElement('img');icon.src=app.icon;icon.alt='';button.append(icon)}else button.textContent='◇';button.onclick=()=>launchApp(id);button.oncontextmenu=event=>{event.preventDefault();const menu=makePopup(button,true);for(const [label,action] of [['open',()=>launchApp(id)],['unpin from taskbar',()=>{dismissPopup();void pinAction(id).catch(showError)}]]){const item=document.createElement('button');item.className='launch';item.textContent=label;item.onclick=action;menu.append(item)}};button.ondragstart=event=>{event.dataTransfer.setData('application/x-igor-app',id);event.dataTransfer.effectAllowed='move';button.dataset.dragging='true'};button.ondragend=event=>{delete button.dataset.dragging;if(event.dataTransfer.dropEffect==='none'&&event.clientY<strip.getBoundingClientRect().top-45)void pinAction(id).catch(showError)};strip.append(button)}}
const pins=document.querySelector('#pins');pins.ondragover=event=>{event.preventDefault();event.dataTransfer.dropEffect='move'};pins.ondrop=event=>{event.preventDefault();const id=event.dataTransfer.getData('application/x-igor-app');if(!appsState.apps.some(app=>app.id===id))return;const list=appsState.pins.filter(pin=>pin!==id);const target=[...pins.children].find(button=>button.dataset.app!==id&&event.clientX<button.getBoundingClientRect().left+17);const index=target?list.indexOf(target.dataset.app):list.length;list.splice(index,0,id);void setPins(list).catch(showError)};
document.querySelector('#app-menu').onclick=event=>{const menu=makePopup(event.currentTarget,true);for(const app of appsState?.apps||[]){const row=document.createElement('div');row.className='row';const open=document.createElement('button');open.className='launch';if(app.icon){const image=document.createElement('img');image.src=app.icon;open.append(image)}const name=document.createElement('span');name.textContent=app.name;open.append(name);open.onclick=()=>launchApp(app.id);open.draggable=true;open.ondragstart=event=>{event.dataTransfer.setData('application/x-igor-app',app.id);event.dataTransfer.effectAllowed='copyMove'};const pin=document.createElement('button');pin.className='pin-action';pin.textContent=appsState.pins.includes(app.id)?'unpin':'pin';pin.onclick=async()=>{try{await pinAction(app.id);pin.textContent=appsState.pins.includes(app.id)?'unpin':'pin'}catch(error){showError(error)}};row.append(open,pin);menu.append(row)}};

async function refreshWindows(){
 if(native || !rfb) return;
 const workspaceState=await rpc("/workspaces");
 windowState=workspaceState;
 const active=workspaceState.workspaces.find(w=>w.active);if(active){const button=document.querySelector('#workspace-button');button.replaceChildren(picture(active),workspaceLabel(active))}
 const catalog=await rpc('/apps');if(JSON.stringify(appsState)!==JSON.stringify(catalog)){appsState=catalog;renderPins()}
 const picker=document.querySelector("#workspaces");
 const signature=JSON.stringify(workspaceState.workspaces);
 if(picker.dataset.signature!==signature){picker.replaceChildren();for(const workspace of workspaceState.workspaces){const option=new Option(workspace.label,workspace.name,workspace.active,workspace.active);picker.add(option)}picker.dataset.signature=signature;}
 const desktop=workspaceState.workspaces.find(workspace=>workspace.active)?.desktop;
 for(const button of document.querySelector('#pins').children){const key=button.dataset.app.replace(/\.desktop$/, '').toLowerCase();button.classList.toggle('running',windowState.windows.some(w=>(w.desktop===desktop||w.desktop===-1)&&(w.app||'').toLowerCase().includes(key)))}

 const strip=document.querySelector("#windows");
 const windows=windowState.windows.filter(window=>window.desktop===desktop||window.desktop===-1);
 const windowSignature=JSON.stringify([windowState.generation,windows]);
 if(strip.dataset.signature===windowSignature)return;
 strip.dataset.signature=windowSignature;strip.replaceChildren();
 for(const window of windowState.windows.filter(window=>window.desktop===desktop || window.desktop===-1)){const chip=document.createElement("div");chip.className="window"+(window.active?" active":"");const focus=document.createElement("button");focus.className="focus";if((window.app||"").toLowerCase().includes("chromium")){const icon=document.createElement("img");icon.src="/assets/chromium.png";icon.alt="";focus.append(icon)}const title=document.createElement("span");title.textContent=window.title.replace(/ - Chromium$/,"");focus.append(title);focus.onclick=()=>windowAction("focus",window.id);const close=document.createElement("button");close.textContent="×";close.className="close";close.title="close window";close.onclick=()=>windowAction("close",window.id);chip.append(focus,close);strip.append(chip);}
}
async function windowAction(action,id){try{await rpc("/windows",{action,id,generation:windowState.generation});await refreshWindows()}catch(error){showError(error)}}
document.querySelector("#workspaces").onchange=event=>selectWorkspace(event.target.value);
document.querySelector("#open-browser").onclick=async()=>{try{await rpc("/workspaces",{action:"open_browser",name:document.querySelector("#workspaces").value,reuse:true});await refreshWindows()}catch(error){showError(error)}};
document.querySelector("#new-workspace").onclick=async()=>{const label=prompt("workspace name");if(!label?.trim())return;try{await rpc("/workspaces",{action:"create",name:"workspace-"+crypto.randomUUID(),label:label.trim()});await refreshWindows()}catch(error){showError(error)}};
document.querySelector("#restore").onclick=()=>windowAction("restore");
async function rpc(path, args) {
  const response = await fetch(path, { method: args === undefined ? 'GET' : 'POST', ...(args === undefined ? {} : { headers: {'Content-Type':'application/json'}, body: JSON.stringify(args) }) });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'could not connect');
  return result;
}
async function connect(token) {
  if (token) {
    const session = await fetch('/session', { method:'POST', headers:{Authorization:`Bearer ${token}`} });
    if (!session.ok) throw new Error('credential not accepted');
  }
  document.querySelector('#login').hidden = true;
  status = await rpc('/status');
  document.querySelector('#automation').checked = !status.automationPaused;
  if (status.mode !== 'human') {
    detail.textContent = status.request?.message || 'computer stays in background until you take control.';
    document.querySelector('#open').hidden = false;
    return;
  }
  document.querySelector('#open').hidden = true;
  if (rfb) return;
  const {default:RFB} = await import('/vnc/core/rfb.js');
  rfb = new RFB(document.querySelector('#screen'), `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/vnc/websockify`);
  rfb.scaleViewport = true; rfb.resizeSession = false;
  rfb.addEventListener('connect', () => { message.style.display='none'; rfb.focus(); void refreshWindows().catch(showError); });
  rfb.addEventListener('disconnect', () => { rfb=null; message.style.display='flex'; detail.textContent='computer hidden'; void connect().catch(showError); });
  clearInterval(interval);
  interval = setInterval(async () => {
    try { const value = await rpc('/status'); if(value.mode !== 'human') rfb?.disconnect(); else await refreshWindows(); } catch(error){showError(error)}
  },2000);
}
function showError(error) { message.style.display='flex'; detail.textContent=error.message; }
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#token');const token=input.value;input.value='';try{await connect(token)}catch(error){showError(error);document.querySelector('#login').hidden=false}});
document.querySelector('#open').onclick=async()=>{const button=document.querySelector('#open');button.disabled=true;detail.textContent='waking your computer…';try{await rpc('/take-control',{});await connect()}catch(error){showError(error)}finally{button.disabled=false}};
document.querySelector('#automation').onchange=async event=>{try{await rpc('/automation-pause',{paused:!event.target.checked})}catch(error){event.target.checked=!event.target.checked;showError(error)}};
document.querySelector('#done').onclick=async()=>{try{const state=await rpc('/close-viewer',{});rfb?.disconnect();detail.textContent=state.automationPaused?'computer hidden · automation paused. switch automation on to resume.':'computer hidden · automation can continue.'}catch(error){showError(error)}};
const token=location.hash.slice(1);
history.replaceState(null,'',location.pathname+location.search);
try{await connect(token)}catch(error){showError(error);document.querySelector('#login').hidden=false}
// Closing a tab must never silently resume a computer still owned by a human.
// Reopening the viewer exposes the explicit done action.
</script></html>
